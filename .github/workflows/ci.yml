name: Furnivo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests -q
      - run: python -m compileall backend
      - name: Verify production migrations
        env:
          DATABASE_URL: sqlite:///ci-migration.db
          AUTO_SEED: 'false'
        run: flask --app backend.app db upgrade

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy when configured
        id: render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping external deploy."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "triggered=true" >> "$GITHUB_OUTPUT"
      - name: Wait for deployed health endpoint
        if: steps.render.outputs.triggered == 'true'
        env:
          FURNIVO_HEALTH_URL: ${{ secrets.FURNIVO_HEALTH_URL }}
        run: |
          if [ -z "$FURNIVO_HEALTH_URL" ]; then
            echo "FURNIVO_HEALTH_URL is not configured; deploy was triggered without a smoke check."
            exit 0
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 "$FURNIVO_HEALTH_URL"; then
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting for cold start/deploy."
            sleep 10
          done
          exit 1
