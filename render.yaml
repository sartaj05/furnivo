services:
  - type: web
    name: furnivo-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: flask --app backend.app db upgrade && gunicorn --chdir . --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: NOTIFICATION_EMAIL_URL
        sync: false
      - key: NOTIFICATION_EMAIL_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_URL
        sync: false
      - key: AUTO_SEED
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: APP_VERSION
        value: furnivo-v3

  - type: web
    name: furnivo-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
